<h2>Add Student Performance</h2>
<form method="POST">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Student Name" required><br>
    <input type="number" name="score" placeholder="Score" required><br>
    <input type="text" name="subject" placeholder="Subject (e.g. Math)" required><br>
    <input type="date" name="date" required><br>
    <button type="submit">Save to Firebase</button>
</form>
<a href="{% url 'dashboard_view' %}">View Dashboard</a>
